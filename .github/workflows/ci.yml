name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: notif, POSTGRES_PASSWORD: notif, POSTGRES_DB: notif_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U notif" --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test -race -count=1 ./...
        env:
          REQUIRE_DB: "1"
          TEST_DATABASE_URL: postgres://notif:notif@localhost:5432/notif_test?sslmode=disable
