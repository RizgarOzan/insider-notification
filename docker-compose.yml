# docker compose up --build
# Provider: the bundled mock answers 202 like webhook.site. To use webhook.site instead, set
# PROVIDER_URL to your own URL (see README) and the mock simply sits idle.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notif
      POSTGRES_PASSWORD: notif
      POSTGRES_DB: notif
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notif -d notif"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes: ["pgdata:/var/lib/postgresql/data"]

  mock-provider:
    build: .
    command: ["mockprovider"]
    environment:
      FAIL_RATE: "${MOCK_FAIL_RATE:-0}"
    ports: ["9090:9090"]

  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
      mock-provider: { condition: service_started }
    environment:
      DATABASE_URL: postgres://notif:notif@db:5432/notif?sslmode=disable
      PROVIDER_URL: "${PROVIDER_URL:-http://mock-provider:9090/send}"
      HTTP_ADDR: ":8080"
    ports: ["8080:8080"]
    restart: unless-stopped

volumes:
  pgdata:
